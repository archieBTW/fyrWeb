<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Archer Woods — DevOps Engineer & Software Developer">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Archer Woods">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=2">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>

  <title>Archer Woods</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      background-color: #000000;
      color: #00FF00;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      height: 100vh;
      overflow: hidden;
    }
    #boot-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: 10px;
      box-sizing: border-box;
      z-index: 9999;
      background-color: #000000;
    }
    #boot-sequence {
      white-space: pre-wrap;
      line-height: 1.4;
    }
    .cursor {
      display: inline-block;
      width: 8px;
      height: 15px;
      background-color: #00FF00;
      animation: blink 1s step-end infinite;
      vertical-align: middle;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
  <script>
    // Audio synthesizer for Grand Theft Ant
    window.cyberSynth = (function() {
      let ctx = null;
      function ensure() {
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) ctx = new AudioCtx();
        }
        if (ctx && ctx.state === 'suspended') ctx.resume();
        return ctx;
      }
      function tone(type, fStart, fEnd, dur, gainVal) {
        const c = ensure();
        if (!c) return;
        const now = c.currentTime;
        const osc = c.createOscillator();
        const g = c.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(fStart, now);
        osc.frequency.exponentialRampToValueAtTime(Math.max(20, fEnd), now + dur);
        g.gain.setValueAtTime(gainVal, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + dur);
        osc.connect(g);
        g.connect(c.destination);
        osc.start(now);
        osc.stop(now + dur);
      }
      function noise(dur, gainVal, filterFreq) {
        const c = ensure();
        if (!c) return;
        const now = c.currentTime;
        const bufSize = Math.floor(c.sampleRate * dur);
        const buf = c.createBuffer(1, bufSize, c.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
        const src = c.createBufferSource();
        src.buffer = buf;
        const flt = c.createBiquadFilter();
        flt.type = 'lowpass';
        flt.frequency.setValueAtTime(filterFreq || 1200, now);
        const g = c.createGain();
        g.gain.setValueAtTime(gainVal, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + dur);
        src.connect(flt);
        flt.connect(g);
        g.connect(c.destination);
        src.start(now);
      }
      return {
        init: function() { ensure(); },
        laser: function() {
          tone('sawtooth', 880, 140, 0.13, 0.16);
          tone('square', 1320, 220, 0.09, 0.08);
        },
        shotgun: function() {
          noise(0.24, 0.28, 950);
          tone('sawtooth', 260, 48, 0.22, 0.22);
        },
        railgun: function() {
          tone('sawtooth', 1600, 180, 0.35, 0.2);
          tone('sine', 2400, 420, 0.32, 0.15);
          noise(0.18, 0.15, 2800);
        },
        hit: function() {
          tone('triangle', 520, 180, 0.07, 0.14);
        },
        explosion: function() {
          noise(0.45, 0.32, 600);
          tone('sawtooth', 140, 28, 0.4, 0.25);
        },
        pickup: function() {
          tone('sine', 520, 1040, 0.16, 0.15);
        },
        dash: function() {
          tone('sine', 220, 880, 0.18, 0.16);
          noise(0.14, 0.1, 1800);
        },
        damage: function() {
          tone('sawtooth', 160, 55, 0.2, 0.24);
          noise(0.15, 0.2, 500);
        }
      };
    })();

    // Desktop Web Gamepad / Controller API bridge
    window.cyberGamepad = (function() {
      return {
        poll: function() {
          try {
            const gps = navigator.getGamepads ? navigator.getGamepads() : [];
            for (let i = 0; i < gps.length; i++) {
              const gp = gps[i];
              if (gp && gp.connected) {
                const axes = [];
                for (let a = 0; a < gp.axes.length; a++) {
                  axes.push(gp.axes[a] || 0.0);
                }
                const buttons = [];
                for (let b = 0; b < gp.buttons.length; b++) {
                  const btn = gp.buttons[b];
                  buttons.push(btn ? (btn.pressed ? 1.0 : btn.value || 0.0) : 0.0);
                }
                return {
                  connected: true,
                  id: gp.id || 'Standard Controller',
                  axes: axes,
                  buttons: buttons
                };
              }
            }
          } catch (e) {}
          return { connected: false };
        }
      };
    })();

    // Local Wallpaper Persistent Storage (IndexedDB)
    window.fyrWallpaperStorage = (function() {
      const DB_NAME = 'fyr_storage_db';
      const STORE_NAME = 'wallpapers';
      const KEY = 'active_custom_wallpaper';

      function openDB(onSuccess, onError) {
        if (!window.indexedDB) {
          if (onError) onError('IndexedDB not supported');
          return;
        }
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = function(e) {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME);
          }
        };
        req.onsuccess = function(e) {
          onSuccess(e.target.result);
        };
        req.onerror = function(e) {
          if (onError) onError(e.target.error);
        };
      }

      return {
        save: function(data, callback) {
          openDB(function(db) {
            try {
              const tx = db.transaction(STORE_NAME, 'readwrite');
              const store = tx.objectStore(STORE_NAME);
              const req = store.put(data, KEY);
              req.onsuccess = function() {
                if (callback) callback(true);
              };
              req.onerror = function() {
                if (callback) callback(false);
              };
            } catch(e) {
              if (callback) callback(false);
            }
          }, function() {
            if (callback) callback(false);
          });
        },
        load: function(callback) {
          openDB(function(db) {
            try {
              const tx = db.transaction(STORE_NAME, 'readonly');
              const store = tx.objectStore(STORE_NAME);
              const req = store.get(KEY);
              req.onsuccess = function() {
                const val = req.result || null;
                if (callback) callback(val);
              };
              req.onerror = function() {
                if (callback) callback(null);
              };
            } catch(e) {
              if (callback) callback(null);
            }
          }, function() {
            if (callback) callback(null);
          });
        },
        clear: function(callback) {
          openDB(function(db) {
            try {
              const tx = db.transaction(STORE_NAME, 'readwrite');
              const store = tx.objectStore(STORE_NAME);
              const req = store.delete(KEY);
              req.onsuccess = function() {
                if (callback) callback(true);
              };
              req.onerror = function() {
                if (callback) callback(false);
              };
            } catch(e) {
              if (callback) callback(false);
            }
          }, function() {
            if (callback) callback(false);
          });
        }
      };
    })();

    // Image Compressor for uploaded wallpapers
    window.fyrCompressImage = function(dataUrl, maxDim, quality, callback) {
      try {
        const img = new Image();
        img.onload = function() {
          let w = img.width;
          let h = img.height;
          const limit = maxDim || 1920;
          if (w > limit || h > limit) {
            if (w >= h) {
              h = Math.round((h * limit) / w);
              w = limit;
            } else {
              w = Math.round((w * limit) / h);
              h = limit;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          let mime = 'image/jpeg';
          if (dataUrl && dataUrl.indexOf('image/png') !== -1) {
            mime = 'image/webp';
          }
          let compressed = canvas.toDataURL(mime, quality || 0.85);
          if (!compressed || compressed === 'data:,' || compressed.length < 50) {
            compressed = canvas.toDataURL('image/jpeg', quality || 0.85);
          }
          if (callback) callback(compressed || dataUrl);
        };
        img.onerror = function() {
          if (callback) callback(dataUrl);
        };
        img.src = dataUrl;
      } catch(e) {
        if (callback) callback(dataUrl);
      }
    };

    // Background Music Audio Engine with MediaSession API integration
    window.fyrMusicPlayer = (function() {
      let audio = null;
      let onPosCb = null;
      let onDurCb = null;
      let onStateCb = null;
      let onEndedCb = null;
      let onMediaActionCb = null;
      let curTitle = '';
      let curArtist = 'Archer Woods';
      let pendingPlay = false;

      function ensureAudio() {
        if (!audio) {
          audio = document.createElement('audio');
          audio.id = 'fyr-background-audio';
          audio.preload = 'auto';
          audio.setAttribute('playsinline', '');
          audio.setAttribute('webkit-playsinline', '');
          audio.style.display = 'none';
          document.body.appendChild(audio);

          audio.addEventListener('timeupdate', function() {
            if (onPosCb) onPosCb(audio.currentTime);
          });
          audio.addEventListener('durationchange', function() {
            if (onDurCb && !isNaN(audio.duration)) onDurCb(audio.duration);
          });
          audio.addEventListener('loadedmetadata', function() {
            if (onDurCb && !isNaN(audio.duration)) onDurCb(audio.duration);
          });
          audio.addEventListener('play', function() {
            if (onStateCb) onStateCb(true);
            updateMediaSessionState('playing');
          });
          audio.addEventListener('pause', function() {
            if (onStateCb) onStateCb(false);
            updateMediaSessionState('paused');
          });
          audio.addEventListener('ended', function() {
            if (onEndedCb) onEndedCb();
          });
          audio.addEventListener('error', function(e) {
            console.warn('HTML5 Audio error:', e);
            if (audio.src && audio.src.indexOf('assets/assets/') !== -1) {
              const fallback = audio.src.replace('assets/assets/', 'assets/');
              audio.src = fallback;
              audio.load();
              if (pendingPlay) {
                audio.play().catch(function() {});
              }
            }
          });

          setupMediaSession();
        }
        return audio;
      }

      function setupMediaSession() {
        if ('mediaSession' in navigator) {
          try {
            navigator.mediaSession.setActionHandler('play', function() {
              if (onMediaActionCb) onMediaActionCb('play');
              else if (audio) audio.play();
            });
            navigator.mediaSession.setActionHandler('pause', function() {
              if (onMediaActionCb) onMediaActionCb('pause');
              else if (audio) audio.pause();
            });
            navigator.mediaSession.setActionHandler('previoustrack', function() {
              if (onMediaActionCb) onMediaActionCb('previoustrack');
            });
            navigator.mediaSession.setActionHandler('nexttrack', function() {
              if (onMediaActionCb) onMediaActionCb('nexttrack');
            });
            navigator.mediaSession.setActionHandler('seekto', function(details) {
              if (details && details.seekTime !== undefined) {
                if (audio) audio.currentTime = details.seekTime;
                if (onMediaActionCb) onMediaActionCb('seekto:' + details.seekTime);
              }
            });
          } catch(e) {}
        }
      }

      function updateMediaSessionState(state) {
        if ('mediaSession' in navigator) {
          try {
            navigator.mediaSession.playbackState = state;
          } catch(e) {}
        }
      }

      function setMetadata(title, artist) {
        curTitle = title || curTitle;
        curArtist = artist || curArtist;
        if ('mediaSession' in navigator && window.MediaMetadata) {
          try {
            navigator.mediaSession.metadata = new MediaMetadata({
              title: curTitle,
              artist: curArtist,
              album: 'Beats by Arch',
              artwork: [
                { src: 'icons/Icon-192.png', sizes: '192x192', type: 'image/png' },
                { src: 'icons/Icon-512.png', sizes: '512x512', type: 'image/png' }
              ]
            });
          } catch(e) {}
        }
      }

      return {
        setSource: function(src, title, artist) {
          const a = ensureAudio();
          pendingPlay = false;
          a.src = src;
          a.load();
          if (title) setMetadata(title, artist);
        },
        play: function() {
          const a = ensureAudio();
          pendingPlay = true;
          return a.play().then(function() {
            pendingPlay = false;
            updateMediaSessionState('playing');
          }).catch(function(e) {
            console.warn('Playback error:', e);
          });
        },
        pause: function() {
          pendingPlay = false;
          if (audio) audio.pause();
          updateMediaSessionState('paused');
        },
        seek: function(seconds) {
          if (audio) audio.currentTime = seconds;
        },
        setVolume: function(volume) {
          if (audio) audio.volume = Math.max(0, Math.min(1, volume));
        },
        setMetadata: setMetadata,
        onPosition: function(cb) { onPosCb = cb; },
        onDuration: function(cb) { onDurCb = cb; },
        onState: function(cb) { onStateCb = cb; },
        onEnded: function(cb) { onEndedCb = cb; },
        onMediaAction: function(cb) { onMediaActionCb = cb; }
      };
    })();
  </script>
</head>
<body>
  <div id="boot-container">
    <span id="boot-sequence"></span><span class="cursor" id="cursor"></span>
  </div>

  <script>
    const bootLines = [
      "[ OK ] Started udev Kernel Device Manager.",
      "[ OK ] Reached target Local File Systems.",
      "         Mounting /boot/efi...",
      "[ OK ] Mounted /boot/efi.",
      "[ OK ] Reached target System Initialization.",
      "[ OK ] Started Daily Cleanup of Temporary Directories.",
      "[ OK ] Started Network Time Synchronization.",
      "[ OK ] Reached target Network.",
      "         Starting D-Bus System Message Bus...",
      "[ OK ] Started D-Bus System Message Bus.",
      "[ OK ] Started User Login Management.",
      "         Loading GUI Server...",
      "[ OK ] GUI Server loaded successfully.",
      "         Loading user profile 'archie'...",
      "         Mounting virtual environments...",
      "[ OK ] fyrOS initialized.",
      "         Boot sequence complete. Launching environment..."
    ];

    const bootSequence = document.getElementById('boot-sequence');
    const bootContainer = document.getElementById('boot-container');
    let lineIndex = 0;

    function addLine() {
      if (lineIndex < bootLines.length) {
        bootSequence.innerHTML += bootLines[lineIndex] + "<br>";
        lineIndex++;
        
        // Random delay to simulate loading process
        const delay = Math.random() * 200 + 50;
        setTimeout(addLine, delay);
      }
    }

    // Start the boot animation
    setTimeout(addLine, 100);

    // Hide the boot container once Flutter renders the first frame
    window.addEventListener('flutter-first-frame', function() {
      bootContainer.style.display = 'none';
    });
  </script>

  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
